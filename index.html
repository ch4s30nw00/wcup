<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>터치라인 — 내가 축구 감독이라면</title>
    <meta name="description" content="2022 카타르 월드컵 90+1분, 그 역습을 당신이 직접 설계합니다. 패스·드리블·슛 궤적을 그리면 확률 엔진이 결과를 판정합니다." />
    <meta name="theme-color" content="#10141c" />

    <!-- 링크 미리보기 (카카오톡·디스코드·트위터). 이미지는 scripts/gen-og.mjs로 생성한다.
         %VITE_SITE_URL%은 빌드 시 치환된다 — 로컬 기본값은 .env, 배포 값은 호스팅 환경변수.
         og:image는 절대 URL이어야 한다(카카오톡은 상대경로를 해석하지 않는다). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="터치라인" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="터치라인 — 내가 축구 감독이라면" />
    <meta property="og:description" content="90+1분, 비기면 탈락. 그 역습을 당신이라면 어떻게 설계하시겠습니까?" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="전술보드 위에 그려진 역습 전개 — 드리블, 패스, 슛" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="터치라인 — 내가 축구 감독이라면" />
    <meta name="twitter:description" content="90+1분, 비기면 탈락. 그 역습을 당신이라면 어떻게 설계하시겠습니까?" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
